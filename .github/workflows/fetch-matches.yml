name: fetch-matches

on:
  schedule:
    # Günlük yenileme (Türkiye saatiyle yaklaşık 06:17; GitHub cron UTC çalışır)
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch real match data
        run: node scripts/fetch-yayinekrani-matches.mjs
        env:
          TZ: Europe/Istanbul

      - name: Commit matches.json
        run: |
          git config user.name "match-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "Veri değişmedi — commit yok"
          else
            git commit -m "matches: günlük otomatik güncelleme"
            git push
          fi
