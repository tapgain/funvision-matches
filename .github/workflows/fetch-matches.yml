name: fetch-matches

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/matches.json'
      - 'public/matches.json'
  schedule:
    # Türkiye saatiyle sabah ve öğlen; GitHub cron UTC çalışır.
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch football broadcasts from Yayın Ekranı
        run: node scripts/fetch-yayinekrani-matches.mjs
        env:
          TZ: Europe/Istanbul
          MATCH_TEAMS: 'Galatasaray,Fenerbahçe,Beşiktaş,Trabzonspor,Türkiye'

      - name: Commit matches.json
        run: |
          git config user.name "match-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/matches.json public/matches.json
          if git diff --cached --quiet; then
            echo "Veri değişmedi — commit yok"
          else
            git commit -m "matches: günlük otomatik güncelleme"
            git push
          fi
